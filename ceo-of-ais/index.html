<style>
  :root { --mint: #88DBBD; --purple: #2F1541; --charcoal: #484A56; --paper: #F2F0EE; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper);
         color: var(--charcoal); font: 16px/1.5 Raleway, system-ui, -apple-system, sans-serif; padding: 88px 16px 32px; }
  .top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
         max-width: 1200px; margin: 0 auto; padding: 28px 32px; }
  .brand { display: block; line-height: 0; }
  .brand img { height: 28px; width: auto; }
  .back { font-weight: 600; font-size: 15px; color: var(--purple); text-decoration: none; }
  .back:hover { text-decoration: underline; }

  @media (max-width: 760px) { .top { padding: 20px 16px; } .brand img { height: 22px; } }

  input:focus { outline: none; border-color: var(--purple); }
  button { margin-top: 16px; width: 100%; font: 600 15px "Space Grotesk", system-ui, sans-serif; padding: 12px;
           border: 0; border-radius: 8px; background: var(--purple); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 22px; margin: 12px 0 0; font-size: 15px; color: #B3261E; }
  .ask { margin: 22px 0 0; padding-top: 20px; border-top: 1px solid #eee; font-size: 15px; }
  .ask p { margin: 0 0 12px; }

<body>
<header class="top">
  <a class="brand" href="/"><img src="/brand/fresh-strategy-logo-charcoal.png" alt="Fresh Strategy" width="221" height="30"></a>
  <a class="back" href="/">&larr; All talks</a>
</header>
<form id="f">
  <div class="eyebrow">Fresh Strategy · Talks</div>
  <h1>CEO of AIs</h1>
  <p class="sub"><!--sub-->Slides and speaker notes from the guest lecture at the University of Bern CAS, 17.10.2026.<!--/sub--></p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button id="go" type="submit">Open the deck</button>
  <p class="msg" id="msg"></p>
  <div class="ask">
    <p>No password yet? Ask us and we'll send it to you.</p>
    <a href="mailto:stephanie@freshstrategy.ai?subject=Password%20for%20CEO%20of%20AIs&amp;body=Hello%20St%C3%A9phanie%2C%0A%0APlease%20send%20me%20the%20password%20for%20CEO%20of%20AIs.%0A%0AName%3A%0AOrganisation%3A%0AWhere%20I%20saw%20the%20talk%3A%0A">Request the password</a>
  </div>
</form>
<script>
const SALT = Uint8Array.from(atob('T2rMSpPWfijiL1bpFaqBcA=='), c => c.charCodeAt(0));
const ITERATIONS = 600000;
const msg = document.getElementById('msg'), go = document.getElementById('go');

function db() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('fresh-talk', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('k');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function store(key) {
  const d = await db();
  await new Promise((res, rej) => { const t = d.transaction('k', 'readwrite'); t.objectStore('k').put(key, 'key'); t.oncomplete = res; t.onerror = rej; });
}
async function stored() {
  const d = await db();
  return new Promise(res => { const g = d.transaction('k').objectStore('k').get('key'); g.onsuccess = () => res(g.result || null); g.onerror = () => res(null); });
}
async function works(key) {
  const buf = new Uint8Array(await (await fetch('enc/check.bin', { cache: 'no-store' })).arrayBuffer());
  try { await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12)); return true; }
  catch (_) { return false; }
}
async function open() {
  await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  location.href = 'd/' + location.hash;   // keep a slide link (#16) through the password page
}

if (!window.isSecureContext || !navigator.serviceWorker || !crypto.subtle) {
  msg.textContent = 'Please open this page over https:// in Chrome, Safari, Edge or Firefox.';
  go.disabled = true;
} else if (!location.search.includes('locked')) {
  stored().then(async k => { if (k && await works(k)) open(); }).catch(() => {});
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  go.disabled = true; msg.textContent = '';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: SALT, iterations: ITERATIONS, hash: 'SHA-256' },
                                              base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    if (!(await works(key))) { msg.textContent = 'Wrong password.'; go.disabled = false; return; }
    await store(key);
    await open();
  } catch (err) {
    msg.textContent = 'Could not open the deck: ' + err.message; go.disabled = false;
  }
});
</script>
</body>
