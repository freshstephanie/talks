<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talks | Fresh Strategy</title>
<meta name="description" content="Talks by Stéphanie Kioutsoukis and Fresh Strategy on putting AI to work in organisations.">
<link rel="canonical" href="https://talks.freshstrategy.ai/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fresh Strategy">
<meta property="og:url" content="https://talks.freshstrategy.ai/">
<meta property="og:title" content="Talks | Fresh Strategy">
<meta property="og:description" content="Talks by Stéphanie Kioutsoukis and Fresh Strategy on putting AI to work in organisations.">
<meta property="og:image" content="https://talks.freshstrategy.ai/home/ceo-of-ais.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F0EE;--ink:#2F1541;--text:#484A56;--muted:#6B6478;--mint:#88DBBD;--green:#1F9E78}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 Raleway,system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 0}
.brand{display:block;line-height:0}
.brand img{height:30px;width:auto}
.back{font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.back:hover{text-decoration:underline}
h1{margin:64px 0 72px;text-align:center;font:500 clamp(48px,6.2vw,88px)/1.03 'Space Grotesk',sans-serif;letter-spacing:-.05em;color:#484955}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}
.talk{display:block;text-decoration:none;background:#fff;border-radius:14px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(47,21,65,.08),0 18px 40px rgba(47,21,65,.10);transition:transform .2s,box-shadow .2s}
.talk:hover{transform:translateY(-4px);box-shadow:0 0 0 1px rgba(47,21,65,.12),0 26px 50px rgba(47,21,65,.16)}
.talk img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.body{padding:22px 26px 26px}
.meta{margin:0 0 8px;font-weight:600;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--green)}
.talk h2{margin:0 0 8px;font:700 28px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.5px;color:var(--ink)}
.talk p.sub{margin:0 0 18px}
.cta{font-weight:700;font-size:15px;color:var(--ink);border-bottom:3px solid var(--mint);padding-bottom:2px}
.lock{margin-left:10px;font-weight:500;font-size:13px;color:var(--muted)}
/* booking band: same line + button as the freshstrategy.ai home page */
.book{margin:88px 0 64px;padding:56px 32px;background:#fff;text-align:center}
.book p{margin:0 0 24px;font:500 clamp(22px,2.4vw,28px)/1.3 'Space Grotesk',sans-serif;color:#484955}
.book a{display:inline-block;background:#484955;color:#fff;border:2px solid #fff;padding:14px 22px;
  font:500 16px 'Space Grotesk',sans-serif;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;transition:transform .2s,box-shadow .2s}
.book a:hover,.book a:focus-visible{transform:scale(1.03);box-shadow:0 4px 15px rgba(0,0,0,.15)}
.book a:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
@media (max-width:760px){.wrap{padding:0 16px}.grid{grid-template-columns:1fr;gap:28px}h1{margin:32px 0 40px}.brand img{height:22px}.book{margin:56px 0 40px;padding:40px 20px}}
</style>
<script src="/ft-analytics.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="https://www.freshstrategy.ai/"><img src="/brand/fresh-strategy-logo-charcoal.png" alt="Fresh Strategy" width="221" height="30"></a>
    <a class="back" href="https://www.freshstrategy.ai/resources">&larr; All resources</a>
  </header>

  <h1>Talks</h1>

  <main class="grid">
    <a class="talk" href="/ceo-of-ais/" aria-label="CEO of AIs: leading when AI becomes part of the workforce (password protected)">
      <img src="home/ceo-of-ais.jpg" alt="Title slide: CEO of AIs, leading when AI becomes part of the workforce">
    </a>
    <a class="talk" href="/ceo-of-ais-aiba/" aria-label="CEO of AIs at AIBA 2026: leading the companies we have, and designing the companies we need">
      <img src="home/ceo-of-ais-aiba.jpg" alt="Title slide: CEO of AIs, AIBA 2026 keynote by Stéphanie Kioutsoukis and Mark Turrell">
    </a>
    <a class="talk" href="/ai-update-2026/" aria-label="AI Update 2026: what changed in a year, and how to get started">
      <img src="home/ai-update-2026.jpg" alt="Title slide: AI Update 2026, what changed in a year, and how to get started">
    </a>
    <a class="talk" href="/building-with-better-feedback/" aria-label="Building with better feedback: how AI-augmented expert panels and user feedback help teams validate new ideas faster">
      <img src="home/building-with-better-feedback.jpg" alt="Title slide: Building with better feedback, how AI-augmented expert panels and user feedback help teams validate new ideas faster">
    </a>
  </main>

  <section class="book">
    <p>Want a talk for your team or event?</p>
    <a href="https://calendar.app.google/24PfpWTwub6F8C5Y8" target="_blank" rel="noopener">Get in touch</a>
  </section>
</div>
</body>
</html>
